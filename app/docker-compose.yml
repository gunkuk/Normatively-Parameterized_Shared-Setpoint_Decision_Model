services:
  db:
    image: postgres:17.5
    environment:
      POSTGRES_DB: npsdm
      POSTGRES_USER: npsdm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_env.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U npsdm"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: ..
      dockerfile: app/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://npsdm:${POSTGRES_PASSWORD}@db:5432/npsdm
      NPSDM_USERS: ${NPSDM_USERS:?Run scripts/setup_env.py}
    volumes:
      - app_cache:/repo/app/outputs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
  app_cache:
